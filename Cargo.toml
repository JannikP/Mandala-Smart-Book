[package]
name = "Mandala-Smart-Book"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Error handling
anyhow = "1.0.102"

# Keeping encoded image data in memory
bytes = "1.12.0"

# UI library and application framework
iced = { version = "0.14.0", default-features = false, features = ["advanced", "canvas", "tokio", "tiny-skia", "fira-sans", "wayland", "image"]}

# Decoding image files
image = { version = "0.25.10", features = ["png"] }

# Timezone and daylight saving aware time
chrono = "0.4"

# Logging
tracing-subscriber = "0.3"

# Access to the SPI bus (SPI0, which is used to send data to the WS2812 LEDs) and the I²C bus.
linux-embedded-hal = "0.4.1"
embedded-hal = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["std"] }

# Shuffling the gallery
rand = "0.10.2"

# Driver for the VEML7700 ambient light sensor
veml7700 = "0.3.2"

# Driver for the GR10-30 gesture sensor
# No official crate. Custom implementation in `gr10-30.rs`.
bitmask-enum = "2.2.5"

# Driver for the SCD41 CO2 sensor
scd4x = { version = "0.5.0", features = ["scd41"] }

# Driver for the PMSA003I air quality sensor
pmsa003i = { version = "0.1.11", features = ["aqi"] }

# Driver for WS2812 LED strip
smart-leds = "0.4.0"
ws2812-spi = { version = "0.5.1", features = ["std"] }

# Async runtime
tokio = { version = "1.52.3", features = ["macros"] }
futures = "0.3.32"

# Setting the screen brightness by manipulating the gamma curve via wayland
wayland-client = "0.31"
wayland-protocols-wlr = "0.3"
tempfile = "3"
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
